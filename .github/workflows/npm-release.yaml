
name: npm publish

on:
  release:
    types: [created]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 24
        registry-url: https://registry.npmjs.org/
        package-manager-cache: false

    - run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate
        yarn --version

    - uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
      with:
        tools: calcit,caps
        caps-version: "0.1.1"

    - run: |
        yarn install --immutable
        caps --strict --ci
        caps verify --toolchain
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        calcit calcit.cirru --check-only
        calcit analyze check-public --ns app.config --ns app.main --ns app.path --ns app.router --ns app.schema --ns app.util --summary-only
        calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru
        calcit calcit.cirru analyze dynamic-methods --format json | jq -e '.data.summary.findings == 0'
        calcit calcit.cirru analyze deprecated --summary-only --format json
        calcit calcit.cirru js

    - run: npm whoami > /dev/null
      env:
        NODE_AUTH_TOKEN: ${{secrets.npm_token}}

    - run: |
        if [ "$IS_PRERELEASE" = true ]; then
          npm publish --tag alpha --access public
        else
          npm publish --access public
        fi
      env:
        IS_PRERELEASE: ${{ github.event.release.prerelease }}
        NODE_AUTH_TOKEN: ${{secrets.npm_token}}
      if: github.event_name == 'release'
